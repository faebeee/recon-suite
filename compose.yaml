name: recon-suite

services:
  # The API image is built on Kali: nmap runs inside it directly (no separate Kali container).
  api:
    build:
      context: .
      dockerfile: apps/api/Containerfile
    image: localhost/recon-suite/api:latest
    init: true
    # Raw sockets for nmap (ARP discovery with MAC/vendor in Host Scan and Network Scan).
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      PORT: 4000
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8090}
      # Optional third-party API keys (CVE Lookup, Reverse IP).
      NVD_API_KEY: ${NVD_API_KEY:-}
      SECURITYTRAILS_API_KEY: ${SECURITYTRAILS_API_KEY:-}
    # No login: anyone who can reach these ports can use every tool. Loopback only.
    ports:
      - '127.0.0.1:${API_PORT:-4000}:4000'
    # nmap reaches internet targets through NAT, but the Host Scan sweep only sees the compose
    # bridge network. Do not switch the api to `network_mode: host` to sweep your LAN: the
    # API would then listen on every host interface, not just loopback. Run the API natively
    # (`pnpm dev`) for LAN sweeps instead.
    #
    # WiFi (R-01): the container has no wireless adapter and no view of the host's
    # NetworkManager by default. The /run/dbus mount below lets nmcli talk to the host's
    # NetworkManager over D-Bus (the wireless device itself stays on the host).
    volumes:
      - recon-data:/app/data
      - /run/dbus:/run/dbus:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Containerfile
    image: localhost/recon-suite/web:latest
    ports:
      - '127.0.0.1:${WEB_PORT:-8090}:8090'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  recon-data:
