name: recon-suite

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Containerfile
    image: localhost/recon-suite/api:latest
    environment:
      PORT: 4000
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-60}
      # Local tools (WiFi scan) also leak the host's surroundings when shared; off by default.
      # Set to true only if you also enabled the host access below, and understand the tradeoff.
      LOCAL_TOOLS_ENABLED: ${LOCAL_TOOLS_ENABLED:-false}
    ports:
      - '${API_PORT:-4000}:4000'
    # --- WiFi adapter access (R-01), opt-in, all disabled by default ---
    # The container has no wireless adapter and no view of the host's NetworkManager by
    # default. To let the WiFi tool see the host's networks: set LOCAL_TOOLS_ENABLED=true
    # above, uncomment the four lines below, and make sure NetworkManager runs on the host
    # (nmcli talks to it over D-Bus; the wireless device itself stays on the host, it is
    # never moved into the container network namespace).
    # network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - /run/dbus:/run/dbus:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/api/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Containerfile
    image: localhost/recon-suite/web:latest
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
