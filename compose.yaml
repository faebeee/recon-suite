name: recon-suite

services:
  kali:
    build:
      context: .
      dockerfile: infra/kali/Containerfile
    image: localhost/recon-suite/kali:latest
    # Fixed name: the API addresses the container by it (KALI_CONTAINER above).
    container_name: recon-kali
    init: true
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # Without host networking, nmap reaches internet targets through NAT, but arp-scan only
    # sees the compose bridge network. To ARP-scan your LAN (Linux hosts only; Docker
    # Desktop and podman machine on macOS/Windows run inside a VM and never see the LAN),
    # uncomment:
    # network_mode: host
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Containerfile
    image: localhost/recon-suite/api:latest
    environment:
      CONTAINER_CLI: podman
      DOCKER_HOST: unix:///run/container-engine.sock
      KALI_CONTAINER: recon-kali
      PORT: 4000
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-60}
      # Local tools (WiFi scan) also leak the host's surroundings when shared; off by default.
      # Set to true only if you also enabled the host access below, and understand the tradeoff.
      LOCAL_TOOLS_ENABLED: ${LOCAL_TOOLS_ENABLED:-false}
      # Login. Requests through nginx are not "local", so set a password (or its hash).
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      API_TOKEN: ${API_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Optional third-party API keys (CVE Lookup, Reverse IP).
      NVD_API_KEY: ${NVD_API_KEY:-}
      SECURITYTRAILS_API_KEY: ${SECURITYTRAILS_API_KEY:-}
    ports:
      - '${API_PORT:-4000}:4000'
    # --- WiFi adapter access (R-01), opt-in, all disabled by default ---
    # The container has no wireless adapter and no view of the host's NetworkManager by
    # default. To let the WiFi tool see the host's networks: set LOCAL_TOOLS_ENABLED=true
    # above, uncomment the four lines below, and make sure NetworkManager runs on the host
    # (nmcli talks to it over D-Bus; the wireless device itself stays on the host, it is
    # never moved into the container network namespace).
    #
    # --- Host Scan (N-02) ---
    # arp-scan needs NET_RAW (Docker grants it by default, Podman does not). Without
    # network_mode: host it only sees the container's own bridge network, not your LAN.
    # network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - recon-data:/app/data
      - /run/dbus:/run/dbus:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/api/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    user: '${KALI_API_USER:-node}'
    group_add:
      - '${CONTAINER_SOCKET_GID:-0}'
    volumes:
      - '${CONTAINER_SOCKET:-/var/run/docker.sock}:/run/container-engine.sock'
    depends_on:
      kali:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Containerfile
    image: localhost/recon-suite/web:latest
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  recon-data:
