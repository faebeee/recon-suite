name: recon-suite

services:
  # The API image is built on Kali: nmap runs inside it directly (no separate Kali container).
  api:
    build:
      context: .
      dockerfile: apps/api/Containerfile
    image: localhost/recon-suite/api:latest
    init: true
    # Raw sockets for nmap (ARP discovery with MAC/vendor in Host Scan and Network Scan).
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      PORT: 4000
      # Origins the browser may call the API from (CSRF check): the proxy on this machine,
      # plus PUBLIC_ORIGINS for the URLs used from other devices, e.g.
      # PUBLIC_ORIGINS=http://192.168.1.20:8090 (empty entries are ignored).
      CORS_ORIGIN: http://localhost:${APP_PORT:-8090},http://127.0.0.1:${APP_PORT:-8090},${PUBLIC_ORIGINS:-}
      # Optional third-party API keys (CVE Lookup, Reverse IP).
      NVD_API_KEY: ${NVD_API_KEY:-}
      SECURITYTRAILS_API_KEY: ${SECURITYTRAILS_API_KEY:-}
    # Not published on the host: only the proxy (and other compose services) reach it.
    expose:
      - '4000'
    # nmap reaches internet targets through NAT, but the Host Scan sweep only sees the compose
    # bridge network. Do not switch the api to `network_mode: host` to sweep your LAN: the
    # API would then listen on every host interface, not just loopback. Run the API natively
    # (`pnpm dev`) for LAN sweeps instead.
    #
    # WiFi (R-01): the container has no wireless adapter and no view of the host's
    # NetworkManager by default. The /run/dbus mount below lets nmcli talk to the host's
    # NetworkManager over D-Bus (the wireless device itself stays on the host).
    volumes:
      - recon-data:/app/data
      - /run/dbus:/run/dbus:ro
    healthcheck:
      # CMD-SHELL with a plain command: podman-compose 1.3.0 breaks multi-part CMD checks.
      test: ['CMD-SHELL', 'node /app/healthcheck.mjs']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    # on-failure, not always/unless-stopped: podman restarts those when the machine or
    # podman-restart.service starts. The stack only runs after `pnpm compose:up`.
    restart: on-failure

  web:
    build:
      context: .
      dockerfile: apps/web/Containerfile
    image: localhost/recon-suite/web:latest
    # Not published on the host: served through the proxy.
    expose:
      - '8090'
    restart: on-failure

  # Single entry point: UI on /, API on /api. The only published port.
  proxy:
    build:
      context: .
      dockerfile: infra/proxy/Containerfile
    image: localhost/recon-suite/proxy:latest
    # No login: anyone who can reach this port can use every tool. Listens on every interface
    # by default (BIND_ADDRESS=0.0.0.0) so the app is reachable on the LAN; set
    # BIND_ADDRESS=127.0.0.1 to keep it on this machine only.
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8090}:8080'
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: on-failure

volumes:
  recon-data:
