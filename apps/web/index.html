<!doctype html>
<html lang="en" class="dark" data-theme="cyber">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b16" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%230b0b16%22/%3E%3Cpath d=%22M6 6h8v3H9v14h5v3H6zM26 6h-8v3h5v14h-5v3h8z%22 fill=%22%2300f0ff%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%223%22 fill=%22%23ff2a6d%22/%3E%3C/svg%3E"
    />
    <title>Recon Suite</title>
    <script>
      // Apply the stored theme before first paint (keep in sync with src/lib/theme.ts).
      try {
        var t = localStorage.getItem('recon-theme');
        var colors = { cyber: '#0b0b16', nothing: '#000000', mono: '#ffffff' };
        if (colors[t]) {
          document.documentElement.dataset.theme = t;
          if (t === 'mono') document.documentElement.classList.remove('dark');
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', colors[t]);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
