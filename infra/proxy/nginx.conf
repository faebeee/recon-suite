# Single entry point for the compose stack: the only container with a published port.
# /api/ goes to the NestJS service, everything else to the static web container.
upstream recon_api {
    server api:4000;
}

upstream recon_web {
    server web:8090;
}

server {
    listen 8080;
    server_name _;

    # Tool requests are small JSON bodies; keep the limit tight.
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://recon_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Informational only: the API never trusts forwarded headers (AGENTS.md rule 8).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nmap scans have no time limit; nginx can't disable its own, so make it very long.
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location / {
        proxy_pass http://recon_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
