# Opt-in override: run arp-scan and nmap in a Kali container instead of the API image.
#
#   pnpm compose:up:kali     (= podman compose -f compose.yaml -f compose.kali.yaml up --build -d)
#
# How it works: the API calls `docker exec recon-kali <fixed command>` (KALI_CONTAINER). For
# that it needs the container engine socket mounted. SECURITY: access to that socket is
# root-equivalent on the host (anyone who controls the API process can start privileged
# containers). Only use this on a machine you control, keep the API behind a login
# (ADMIN_PASSWORD_HASH) and never expose it publicly.
#
# Socket path on the host (CONTAINER_SOCKET in .env):
#   Docker (Linux / Docker Desktop):  /var/run/docker.sock (default)
#   Podman rootful / podman machine:  /run/podman/podman.sock
#   Podman rootless (Linux):          /run/user/<uid>/podman/podman.sock
#   Check with: podman info --format '{{.Host.RemoteSocket.Path}}'
# The API process runs as "node" and needs read/write access to the socket: set
# CONTAINER_SOCKET_GID to the socket's group id (`stat -c %g <socket>`; 0 for root-owned
# sockets). With rootless Podman the socket is only accessible to container root: set
# KALI_API_USER=0 there.

services:
  api:
    build:
      args:
        WITH_DOCKER_CLI: 'true'
    environment:
      KALI_CONTAINER: recon-kali
      # The docker CLI also speaks Podman's Docker-compatible API.
      CONTAINER_CLI: docker
      DOCKER_HOST: unix:///run/container-engine.sock
    user: '${KALI_API_USER:-node}'
    group_add:
      - '${CONTAINER_SOCKET_GID:-0}'
    volumes:
      - '${CONTAINER_SOCKET:-/var/run/docker.sock}:/run/container-engine.sock'
    depends_on:
      kali:
        condition: service_started

  kali:
    build:
      context: .
      dockerfile: infra/kali/Containerfile
    image: localhost/recon-suite/kali:latest
    # Fixed name: the API addresses the container by it (KALI_CONTAINER above).
    container_name: recon-kali
    init: true
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # Without host networking, nmap reaches internet targets through NAT, but arp-scan only
    # sees the compose bridge network. To ARP-scan your LAN (Linux hosts only; Docker
    # Desktop and podman machine on macOS/Windows run inside a VM and never see the LAN),
    # uncomment:
    # network_mode: host
    restart: unless-stopped
